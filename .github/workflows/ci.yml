name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test, package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Check first-party packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in mods/*/; do
            dir="${dir%/}"
            echo "pwc package check $dir"
            cargo run -q --locked -p pwc-cli -- package check "$dir"
          done

  reuse:
    name: REUSE licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: reuse lint
        uses: fsfe/reuse-action@v6
