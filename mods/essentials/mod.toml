format = 1

[package]
id = "pwc.essentials"
name = "Essentials"
version = "2.0.0"
description = "The first-party essentials of PWC: menus, start screen, hotbar, inventory, game UI, chat and commands, visuals, neural textures, material names, InfiniteDiffusion worldgen, sounds and proximity chat."
authors = ["Project Watt Cubed contributors"]
license = "Apache-2.0 OR MIT"
license-files = ["LICENSES/Apache-2.0.txt", "LICENSES/MIT.txt"]
kind = "bundle"
readme = "README.md"
icon = "assets/icon.svg"
repository = "https://github.com/gusahlg/pwc-package-manager"
keywords = ["essentials", "first-party"]
categories = ["bundle"]

[dependencies]
"pwc.menus" = "^1.0"
"pwc.start-screen" = "^1.0"
"pwc.hotbar" = "^2.1"
"pwc.inventory" = "^2.1"
"pwc.game-ui" = "^2.0"
"pwc.chat-commands" = "^1.0"
"pwc.visuals" = "^1.0"
"pwc.neural-textures" = "^1.0"
"pwc.material-names" = "^1.0"
"pwc.infinite-diffusion" = "^1.0"
"pwc.sounds" = "^1.0"
"pwc.proximity-chat" = "^1.1"
