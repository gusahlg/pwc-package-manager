pwc-api = "^3.1"
readme = "README.md"
icon = "assets/icon.svg"
repository = "https://github.com/gusahlg/pwc-package-manager"
keywords = ["physics", "simulation", "law", "gauge", "electromagnetism"]
categories = ["library"]

[dependencies]
"pwc.law-core" = "^0.1"
