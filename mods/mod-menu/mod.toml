format = 1

[package]
id = "pwc.mod-menu"
name = "Mod menu"
version = "1.0.0"
description = "The packages compiled into this build, read-only: grouped under their bundles, with what each needs and what a server suspended."
authors = ["Project Watt Cubed contributors"]
license = "Apache-2.0 OR MIT"
license-files = ["LICENSES/Apache-2.0.txt", "LICENSES/MIT.txt"]
kind = "mod"
pwc-api = "^3.0"
readme = "README.md"
icon = "assets/icon.svg"
repository = "https://github.com/gusahlg/pwc-package-manager"
keywords = ["mods", "menu", "packages"]
categories = ["interface"]

[dependencies]
"pwc.ui-kit" = "^1.0"
