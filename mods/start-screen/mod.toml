format = 1

[package]
id = "pwc.start-screen"
name = "Start screen"
version = "2.0.0"
description = "The default start screen: main menu, a page of saved worlds, the host and join server forms, and the waiting page while a world loads."
authors = ["Project Watt Cubed contributors"]
license = "Apache-2.0 OR MIT"
license-files = ["LICENSES/Apache-2.0.txt", "LICENSES/MIT.txt"]
kind = "mod"
pwc-api = "^3.0"
readme = "README.md"
icon = "assets/icon.svg"
repository = "https://github.com/gusahlg/pwc-package-manager"
keywords = ["start-screen", "menu", "saves", "multiplayer"]
categories = ["interface"]

[dependencies]
"pwc.ui-kit" = "^1.0"
